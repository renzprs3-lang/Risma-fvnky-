
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZKA RMX DJ PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090916;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:22px;background:#17172b;border-bottom:2px solid #00eaff}
h1{color:#00eaff;margin:0;text-shadow:0 0 12px #00eaff}
main{max-width:850px;margin:auto;padding:16px}
.decks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.deck{background:#19192e;border:1px solid #00d9ff;border-radius:14px;padding:15px;text-align:center}
.disc{width:100px;height:100px;border:8px solid #444;border-radius:50%;margin:12px auto;background:radial-gradient(circle,#00eaff 0 8%,#111 10% 100%);box-shadow:0 0 18px #00d9ff}
button{background:#00cfe8;color:#071018;border:0;border-radius:9px;padding:12px;margin:5px;font-weight:bold}
input{max-width:100%}
.panel{background:#19192e;padding:15px;border-radius:14px;margin-top:15px}
.track{padding:12px;border-bottom:1px solid #444;display:flex;justify-content:space-between;gap:8px;align-items:center}
.track button{padding:9px}
small{color:#aaa}
@media(max-width:480px){.decks{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>AZKA RMX DJ PRO</h1>
<p>DJ Music Player</p>
</header>
<main>
<div class="decks">
<section class="deck">
<h2>DECK A</h2><div class="disc"></div>
<audio id="audioA" controls style="width:100%"></audio>
<button onclick="document.getElementById('audioA').play()">PLAY A</button>
<button onclick="document.getElementById('audioA').pause()">PAUSE</button>
</section>
<section class="deck">
<h2>DECK B</h2><div class="disc"></div>
<audio id="audioB" controls style="width:100%"></audio>
<button onclick="document.getElementById('audioB').play()">PLAY B</button>
<button onclick="document.getElementById('audioB').pause()">PAUSE</button>
</section>
</div>
<section class="panel">
<h2>🎵 MUSIC LIBRARY</h2>
<p><small>Pilih lagu untuk diputar di Deck A atau Deck B.</small></p>
<div id="library">Belum ada daftar lagu.</div>
</section>
<section class="panel">
<h2>🎚️ DJ MIXER</h2>
<label>Crossfader</label>
<input type="range" min="0" max="100" value="50" style="width:100%" oninput="mix(this.value)">
</section>
</main>
<script>
const SUPABASE_URL="https://fvrslvvzfuygkswvzmou.supabase.co";
const BUCKET="Azka music";
const SONGS=[];
const SONGS=[
{
name:"Onty Azka Rmx nex",
url:"https://fvrslvvzfuygkswvzmou.supabase.co/storage/v1/object/public/Azka%20music/Onty%20Azka%20Rmx%20nex%20.mp3"
},
{
name:"Risma Fvnky Cantik Dari RT 5",
url:"https://fvrslvvzfuygkswvzmou.supabase.co/storage/v1/object/public/Azka%20music/Risma%20Fvnky%20Cantik%20Dari%20RT%205%20-%20Risma%20Fvnky.mp3"
},
{
name:"SA CINTA KO RISMA",
url:"https://fvrslvvzfuygkswvzmou.supabase.co/storage/v1/object/public/Azka%20music/SA%20CINTA%20KO%20RISMA%20-%20SAD%20SLOW%20-%20AZKA%20RMX%20FT.%20RISMA%20RMX.mp3"
},
{
name:"KITA CINTA PA NGANA",
url:"https://fvrslvvzfuygkswvzmou.supabase.co/storage/v1/object/public/Azka%20music/KITA%20CINTA%20PA%20NGANA%20-%20AZKA%20RMX%20FT%20RISMA%20RMX.mp3"
},
{
name:"JANGAN SE TINGGAL KITA RISMA",
url:"https://fvrslvvzfuygkswvzmou.supabase.co/storage/v1/object/public/Azka%20music/JANGAN%20SE%20TINGGAL%20KITA%20RISMA%20-%20AZKA%20RMX%20FT.%20RISMA%20RMX%20(1).mp3"
}
];
 
const library=document.getElementById("library");
function addSong(name,url){
 const item=document.createElement("div");
 item.className="track";
 const title=document.createElement("span");
 title.textContent=name;
 const controls=document.createElement("span");
 ["A","B"].forEach(deck=>{
  const btn=document.createElement("button");
  btn.textContent="▶ "+deck;
  btn.onclick=()=>{
   const audio=document.getElementById("audio"+deck);
   audio.src=url;
   audio.play();
  };
  controls.appendChild(btn);
 });
 item.append(title,controls);
 library.appendChild(item);
}
SONGS.forEach(song=>addSong(song.name,song.url));
function mix(value){
 const a=document.getElementById("audioA");
 const b=document.getElementById("audioB");
 a.volume=1-value/100;
 b.volume=value/100;
}
</script>
</body>
</html>
