
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZKA RMX DJ PRO</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:16px;
  font-family:Arial,sans-serif;
  color:white;
  background:linear-gradient(135deg,#090016,#16002d,#001b30);
}
header{text-align:center;padding:20px 0}
h1{color:#00eaff;text-shadow:0 0 15px #00eaff}
h2{color:#ff36d7}
.deck{
  background:#17132b;
  border:1px solid #00eaff;
  border-radius:15px;
  padding:18px;
  margin:15px 0;
  box-shadow:0 0 12px #00eaff55;
}
button{
  background:#00cce8;color:#001018;
  border:0;border-radius:8px;
  padding:11px 14px;margin:5px;
  font-weight:bold;
}
button:active{background:#ff36d7}
.song{
  background:#29203e;padding:12px;
  margin:9px 0;border-radius:9px;
}
.song button{float:right}
audio{width:100%;margin:8px 0}
input[type=range]{width:100%;accent-color:#00eaff}
small{color:#aaa}
</style>
</head>
<body>

<header>
<h1>🎧 AZKA RMX DJ PRO</h1>
<p>WELCOME TO MY DJ MUSIC PLAYER</p>
</header>

<div class="deck">
<h2>🎵 DECK A</h2>
<p id="titleA">Belum ada lagu</p>
<audio id="audioA" controls></audio>
<button onclick="playA()">PLAY A</button>
<button onclick="pauseA()">PAUSE A</button>
</div>

<div class="deck">
<h2>🎵 DECK B</h2>
<p id="titleB">Belum ada lagu</p>
<audio id="audioB" controls></audio>
<button onclick="playB()">PLAY B</button>
<button onclick="pauseB()">PAUSE B</button>
</div>

<div class="deck">
<h2>🎚️ CROSSFADER</h2>
<input type="range" min="0" max="100" value="50"
oninput="mix(this.value)">
<p><small>DECK A ← GESER → DECK B</small></p>
</div>

<div class="deck">
<h2>🎼 MUSIC LIBRARY</h2>
<div id="library"></div>
</div>

<footer style="text-align:center;padding:20px">
<small>AZKA RMX DJ PRO © 2026</small>
</footer>

<script>
const SONGS = [
{
name:"Onty Azka Rmx nex",
url:"https://fvrslvvzfuygkswvzmou.supabase.co/storage/v1/object/public/Azka%20music/Onty%20Azka%20Rmx%20nex%20.mp3"
},
{
name:"Risma Fvnky Cantik Dari RT 5",
url:"https://fvrslvvzfuygkswvzmou.supabase.co/storage/v1/object/public/Azka%20music/Risma%20Fvnky%20Cantik%20Dari%20RT%205%20-%20Risma%20Fvnky.mp3"
},
{
name:"SA CINTA KO RISMA",
url:"https://fvrslvvzfuygkswvzmou.supabase.co/storage/v1/object/public/Azka%20music/SA%20CINTA%20KO%20RISMA%20-%20SAD%20SLOW%20-%20AZKA%20RMX%20FT.%20RISMA%20RMX.mp3"
},
{
name:"KITA CINTA PA NGANA",
url:"https://fvrslvvzfuygkswvzmou.supabase.co/storage/v1/object/public/Azka%20music/KITA%20CINTA%20PA%20NGANA%20-%20AZKA%20RMX%20FT%20RISMA%20RMX.mp3"
},
{
name:"JANGAN SE TINGGAL KITA RISMA",
url:"https://fvrslvvzfuygkswvzmou.supabase.co/storage/v1/object/public/Azka%20music/JANGAN%20SE%20TINGGAL%20KITA%20RISMA%20-%20AZKA%20RMX%20FT.%20RISMA%20RMX%20(1).mp3"
}
];

const audioA=document.getElementById("audioA");
const audioB=document.getElementById("audioB");
const titleA=document.getElementById("titleA");
const titleB=document.getElementById("titleB");
const library=document.getElementById("library");

function loadA(song){
  audioA.src=song.url;
  titleA.textContent=song.name;
  audioA.load();
}
function loadB(song){
  audioB.src=song.url;
  titleB.textContent=song.name;
  audioB.load();
}
function playA(){audioA.play()}
function pauseA(){audioA.pause()}
function playB(){audioB.play()}
function pauseB(){audioB.pause()}

function mix(value){
  const x=Number(value)/100;
  audioA.volume=1-x;
  audioB.volume=x;
}

SONGS.forEach((song,index)=>{
  const item=document.createElement("div");
  item.className="song";

  const name=document.createElement("strong");
  name.textContent=(index+1)+". "+song.name;

  const buttons=document.createElement("div");

  const buttonA=document.createElement("button");
  buttonA.textContent="DECK A";
  buttonA.onclick=()=>loadA(song);

  const buttonB=document.createElement("button");
  buttonB.textContent="DECK B";
  buttonB.onclick=()=>loadB(song);

  buttons.appendChild(buttonA);
  buttons.appendChild(buttonB);
  item.appendChild(name);
  item.appendChild(buttons);
  library.appendChild(item);
});
</script>
</body>
</html>
